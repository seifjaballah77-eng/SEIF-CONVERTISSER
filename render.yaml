services:
  - type: web
    name: seif-convertisser-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MAX_UPLOAD_MB
        value: "500"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: YT_COOKIES_BASE64
        sync: false
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
